<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PyQt FDM 下载器</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
body { background:#0f1115; color:#eaeef3; font-family:Arial; margin:0; padding:20px;}
h2 {margin-bottom:20px;}
table {width:100%; border-collapse: collapse;}
th, td {padding:8px; text-align:left;}
th {background:#1a1f2a; color:#fff;}
tr:nth-child(even){background:#161a22;}
.progress-wrap {background:#222734; border-radius:6px; height:16px; overflow:hidden; width:100%;}
.progress {height:100%; width:0%; background:linear-gradient(90deg,#18a957,#3fb950,#8bc34a); transition: width 0.2s ease-out;}
button {padding:4px 8px; border-radius:4px; border:none; margin:0 2px; cursor:pointer; background:#3fb950; color:#fff;}
button:hover {background:#2ea043;}
</style>
</head>
<body>
<h2>⬇️ FDM 风格下载器</h2>

<table id="taskTable">
  <thead>
    <tr>
      <th>文件名</th>
      <th>进度</th>
      <th>大小</th>
      <th>已用时间</th>
      <th>剩余时间</th>
      <th>速度</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    <!-- 下载任务行由 JS 动态插入 -->
  </tbody>
</table>

<script>
var bridge;
var tasks = {};

function formatSize(bytes){
    if(bytes<1024) return bytes+" B";
    if(bytes<1024*1024) return (bytes/1024).toFixed(2)+" KB";
    if(bytes<1024*1024*1024) return (bytes/1024/1024).toFixed(2)+" MB";
    return (bytes/1024/1024/1024).toFixed(2)+" GB";
}

function createTaskRow(taskId, fileName){
    const tbody = document.getElementById("taskTable").querySelector("tbody");
    const row = document.createElement("tr");
    row.id = "task_" + taskId;
    row.innerHTML = `
        <td>${fileName}</td>
        <td>
          <div class="progress-wrap">
            <div class="progress" id="progress_${taskId}"></div>
          </div>
        </td>
        <td id="size_${taskId}">-</td>
        <td id="used_${taskId}">0s</td>
        <td id="remain_${taskId}">-</td>
        <td id="speed_${taskId}">0 B/s</td>
        <td>
          <button onclick="pause('${taskId}')">⏸️</button>
          <button onclick="resume('${taskId}')">▶️</button>
          <button onclick="stop('${taskId}')">⏹️</button>
          <button onclick="openFolder('${taskId}')">📂</button>
        </td>
    `;
    tbody.appendChild(row);
}

new QWebChannel(qt.webChannelTransport, function(channel){
    bridge = channel.objects.bridge;

    // 添加任务
    bridge.addTask.connect(function(taskId, fileName){
        tasks[taskId] = {fileName: fileName};
        createTaskRow(taskId, fileName);
    });

    // 更新进度
    bridge.progressChanged.connect(function(taskId, done, total, speed){
        const ratio = total>0 ? (done/total*100).toFixed(2) : 0;
        document.getElementById("progress_" + taskId).style.width = ratio + "%";
        document.getElementById("size_" + taskId).innerText = formatSize(done) + " / " + formatSize(total);
        document.getElementById("speed_" + taskId).innerText = formatSize(speed) + "/s";
    });

    // 更新时间
    bridge.timeChanged.connect(function(taskId, used, remain){
        document.getElementById("used_" + taskId).innerText = used + "s";
        document.getElementById("remain_" + taskId).innerText = remain + "s";
    });

    // 状态更新可以改颜色或显示完成
    bridge.stateChanged.connect(function(taskId, msg){
        const row = document.getElementById("task_" + taskId);
        if(msg.includes("完成")){
            row.style.background = "#143214"; // 绿色完成
        } else if(msg.includes("错误")){
            row.style.background = "#4a1414"; // 红色错误
        }
    });
});

// 前端操作按钮
function pause(taskId){ if(bridge) bridge.pauseTask(taskId); }
function resume(taskId){ if(bridge) bridge.resumeTask(taskId); }
function stop(taskId){ if(bridge) bridge.stopTask(taskId); }
function openFolder(taskId){ if(bridge) bridge.openFolder(taskId); }

</script>
</body>
</html>
